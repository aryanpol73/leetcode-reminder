# Triggers the PWA push dispatcher so alarms reach closed apps.
# Setup: repo Settings → Secrets and variables → Actions
#   Variable LEETPING_URL  = https://your-app.vercel.app
#   Secret   CRON_SECRET   = same value as the CRON_SECRET env var on Vercel
# GitHub runs scheduled jobs every 5 minutes at best (often later). For on-the-minute alarms,
# point a free cron-job.org job at  $LEETPING_URL/api/dispatch?key=$CRON_SECRET  every minute.
name: Dispatch push alarms

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    if: ${{ vars.LEETPING_URL != '' }}
    steps:
      - name: Send due alarms
        run: |
          curl -fsS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ vars.LEETPING_URL }}/api/dispatch"
